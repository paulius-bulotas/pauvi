services:
  mysql:
    image: mysql:8.4
    container_name: pauvi-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - ${DATA_ROOT}/mysql:/var/lib/mysql

    ports:
      - "192.168.1.254:${MYSQL_HOST_PORT:-3306}:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      db:
        aliases:
          - pauvi-mysql

networks:
  db:
    name: pauvi-db-net
    driver: bridge
