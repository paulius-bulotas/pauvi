<Proxy "balancer://pauvi-fe">
    BalancerMember "http://127.0.0.1:8081" retry=1
    BalancerMember "http://127.0.0.1:8083" retry=1 status=+H
    ProxySet lbmethod=byrequests
</Proxy>

<Proxy "balancer://pauvi-api">
    BalancerMember "http://127.0.0.1:3001" retry=1
    BalancerMember "http://127.0.0.1:3003" retry=1 status=+H
    ProxySet lbmethod=byrequests
</Proxy>
