<VirtualHost *:80>
    ServerName 192.168.1.254

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        / http://127.0.0.1:8081/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/pauvi-error.log
    CustomLog ${APACHE_LOG_DIR}/pauvi-access.log combined
</VirtualHost>
