<VirtualHost *:80>
    ServerName paulius.local
    ServerAlias vika.local

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        "/" "balancer://pauvi-fe/"
    ProxyPassReverse "/" "balancer://pauvi-fe/"

    ErrorLog ${APACHE_LOG_DIR}/pauvi-error.log
    CustomLog ${APACHE_LOG_DIR}/pauvi-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName api.local

    ProxyRequests Off
    ProxyPreserveHost On

    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        "/" "balancer://pauvi-api/"
    ProxyPassReverse "/" "balancer://pauvi-api/"

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined
</VirtualHost>
